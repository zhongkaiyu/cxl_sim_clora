#system parameters
gpu_channel_number = 16;                 #number of gpu channels
cxl_channel_number = 16;                 #number of cxl channels
chip_number = 1;                        #number of chips/cxl device, 1 for cxl


#hardware parameters
cxl_bandwidth = 128;                 # GB/s  (CXL 3.1 link, paper Table 4)
dram_channel_num = 8;                # 8 LPDDR5X packages / device (paper Table 4)
dram_channel_bandwidth = 136;        # GB/s per package; 8 x 136 = 1088 GB/s ~= 1.1 TB/s
chip_computing_power = 2000;          # NDP compute, GOPS. 2 TFLOPS/device (paper Table 4)
cxlctrl_buf_size = 1024;              # B (128B for each request)
sub_req_inst_size = 128;

#time parameters
t_CMD_CXL = 30;                     # Command transfer latecy of CXL link, unit is ns
t_ANALYZE = 10;                         # Analyze the request latency, unit is ns
t_CMD_DRAM = 10;                    # Command transfer latecy of DRAM, unit is ns
t_DRAM_READ_LATENCY = 30;                         # the unit is ns
t_DRAM_WRITE_LATENCY = 40;                         # the unit is ns

# Reviewer-requested overhead terms (ns). Defaults are 0 so existing
# comparisons reproduce; set to non-zero to enable sensitivity studies.
L_CXL_switch = 0;                   # fixed one-way CXL switch traversal latency
L_read_compute_cmd = 0;             # fixed NDP-side command setup/dispatch overhead



# static parameters
data type = 16;                        # FP16 (16-bit) — matches the workload's S=2 bytes
npu computing power = 1000;          # the unit is GOPS
model dim = 4096;
input length = 512;
dram capacity = 0;                      #the unit is B
die number = 1;                         # die num per chip
plane number = 1;
block number = 4096;  
page number = 256;      
page capacity = 1;
subpage capacity = 1;